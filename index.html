<!DOCTYPE html>
<!-- ============================================================
    【这个文件是什么】
    index.html 是网页的「骨架 / 结构」，只负责摆放内容，
    不负责好看（颜色样式在 src/styles/ 里），也不负责计算（逻辑在 src/ 里）。

    HTML 的工作方式：用一对对「标签」把内容包起来，形成一棵树。
    例如 <div class="calc"> ... </div> 表示这里是一个区块。

    【Vite 项目的特殊之处】
    1. 只有一个 index.html，放在项目根目录，Vite 把它当「大门」。
    2. 不再用 <link> 引 CSS，也不再引多个 <script>，
       只保留下面那一句 <script type="module">，其余资源全由它 import 进来。
    3. Vite 会把所有资源打包、压缩，最后生成 dist 目录用于上线。
    ============================================================ -->

<!-- lang="zh-CN" 告诉浏览器/屏幕阅读器：这个页面是简体中文 -->
<!-- data-theme="light" 是自定义属性，用来记录当前主题。
     CSS 里写 html[data-theme="dark"] {...} 就能切换整套配色。
     初始值写 light，就是「日间羊皮纸」古典配色。 -->
<html lang="zh-CN" data-theme="light">

<head>
  <!-- head 里的内容不会显示在页面上，是给浏览器看的「说明书」 -->

  <!-- charset：字符编码。用 UTF-8 才不会出现中文乱码 -->
  <meta charset="UTF-8" />

  <!-- viewport：手机浏览器专用设置。
       width=device-width 表示「页面宽度 = 手机屏幕宽度」；
       initial-scale=1.0 表示「初始缩放比例 100%，不要自动放大缩小」。
       没有这一行，手机上看到的页面会像缩小版的电脑页面 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 浏览器标签页上显示的标题 -->
  <title>计算器 · 哈希 · 口算擂台</title>

  <!-- 说明这个页面用什么颜色，让手机浏览器的地址栏也跟着变色 -->
  <meta name="theme-color" content="#d9c8a4" />

  <!-- 注意：这里没有 <link rel="stylesheet">。
       CSS 是通过 src/main.js 里的 import "./styles/base.css" 引进来的，
       这是 Vite 的推荐做法：由 JS 统一管理资源依赖。
       这么做还有个好处——打包时 Vite 能自动压缩、合并这些 CSS。 -->
</head>

<body>
  <!-- ============================================================
       class 命名说明（BEM 风格，是社区里很流行的一种命名约定）
       .app              区块名
       .brand__mark      双下划线：区块 .brand 里面的一个「元素」
       .key--num         双横线：.key 的一种「变体/状态」
       这样命名可以避免不同区块的样式互相打架，也方便看懂层级关系。
       ============================================================ -->

  <!-- .app 是外层大容器：把「计算器」和「历史记录」并排放在一起 -->
  <div class="app">

    <!-- <main> 是语义标签，表示「这个页面的主要内容」。
         浏览器显示效果和 <div> 一样，但有利于搜索引擎和无障碍阅读 -->
    <main class="calc">

      <!-- ---------------- 顶部：标题 + 功能按钮 ---------------- -->
      <header class="calc__head">
        <div class="brand">
          <!-- 装饰用的菱形符号，纯好看，没有实际功能 -->
          <span class="brand__mark">❖</span>
          <div class="brand__name">
            <!-- h1 是「一级标题」，一个页面通常只写一个，表示最重要的标题 -->
            <h1>计算器</h1>
            <!-- em 原本表示「强调」，这里借它显示小号英文副标题，
                 具体外观（小字、字距）由 CSS 控制 -->
            <em>Calculator</em>
          </div>
        </div>

        <div class="head-actions">
          <!-- 【重点】每个 <button> 都写了 type="button"。
               按钮在 <form> 表单里默认是 type="submit"（提交表单），
               我们的计算器没有表单，但养成习惯写上可以避免意外行为。
               id="historyBtn" 是这块按钮的「身份证号」，JavaScript 靠它找到这个按钮。
               aria-label 是给读屏软件（视障用户）念出来的说明文字 -->
          <button id="historyBtn" class="icon-btn" type="button" title="历史记录" aria-label="历史记录" aria-expanded="false">
            <!-- SVG 是「矢量图」：用数学坐标画图，放大不会模糊。
                 viewBox="0 0 24 24" 意思是：把这块画布看作 24×24 的坐标系。
                 path 的 d 属性是画线指令；circle 是画圆。
                 aria-hidden="true" 表示「读屏软件忽略这张图」，
                 因为按钮本身已有 aria-label 说明用途了 -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 7v5l3.5 2" />
              <circle cx="12" cy="12" r="9" />
            </svg>
          </button>

          <!-- 哈希计算按钮：点开一个弹层，把文本变成一串「指纹」 -->
          <button id="hashBtn" class="icon-btn" type="button" title="哈希计算" aria-label="哈希计算" aria-expanded="false">
            <!-- 图标画的是一个「#」井号：两条斜竖线 + 两条横线。
                 哈希的英文 hash 本身也有「#」这个符号的意思，
                 所以用井号当图标最直观 -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9.5 4 7.5 20M16.5 4l-2 16M4 9.5h16M3.5 14.5h16" />
            </svg>
          </button>

          <!-- 【新增】口算擂台按钮：点开一个弹层，限时练口算 -->
          <button id="gameBtn" class="icon-btn" type="button" title="口算擂台" aria-label="口算擂台" aria-expanded="false">
            <!-- 图标画的是一个靶子：三个同心圆，越往里越小，
                 和外层 .icon-btn svg 的 stroke 样式配合，就是一个靶心 -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8.4" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="12" cy="12" r="0.7" />
            </svg>
          </button>

          <button id="themeBtn" class="icon-btn" type="button" title="切换主题" aria-label="切换主题">
            <!-- 这里放了两张图：月亮和太阳。
                 它们不是用 JS 切换的，而是纯 CSS 控制显示/隐藏：
                 亮色主题只显示太阳，暗色主题只显示月亮。 -->
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2" />
              <path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7" />
            </svg>
          </button>
        </div>
      </header>

      <!-- 花饰分隔线：三个小元素横排（左右两条渐变线 + 中间菱形）。
           aria-hidden="true"：纯装饰，读屏软件直接跳过 -->
      <div class="ornament" aria-hidden="true">
        <span></span>❖<span></span>
      </div>

      <!-- ---------------- 中间：显示屏 ---------------- -->
      <section class="display">
        <!-- 第一行小字：显示你正在输入的「算式原文」，例如 12+3×
             id="expr" → 对应 JS 里的 document.getElementById("expr")
             aria-hidden="true" 表示读屏软件不用念这一行（避免重复念两遍） -->
        <div class="display__expr" id="expr" aria-hidden="true"></div>

        <!-- 第二行大字：显示实时计算结果。初始内容先写一个 0。
             【无障碍知识点】aria-live="polite" 的意思是：
             这块内容一旦变化，请读屏软件「温和地」播报出来，
             这样视障用户按完按钮也能听到新结果。 -->
        <div class="display__result" id="result" aria-live="polite">0</div>
      </section>

      <!-- ---------------- 下方：按键区 ---------------- -->
      <!-- 【核心机制】每个按键都用两个自定义属性告诉 JS 自己是谁：
           data-value="7"    → 按下后要把字符串 "7" 插进算式里
           data-action="equals" → 按下后要执行「求值」这个动作
           JS 通过 button.dataset.value / button.dataset.action 读取它们。
           好处是：HTML 里描述「这个键是什么」，JS 里只写一次处理规则，
           要加新按钮只需复制一行改数据，不用改 JS。 -->
      <div class="keys" id="keys">

        <!-- 第一行：科学函数键。笔记：data-value 是 "sin(" 带着左括号，
             因为点一下 sin 就顺便帮你开好括号，少按一次 -->
        <button class="key key--fn" type="button" data-value="sin(">sin</button>
        <button class="key key--fn" type="button" data-value="cos(">cos</button>
        <button class="key key--fn" type="button" data-value="tan(">tan</button>
        <button class="key key--fn" type="button" data-value="ln(">ln</button>
        <button class="key key--fn" type="button" data-value="log(">log</button>

        <!-- 第二行：AC 清空 / 退格 / 括号 / 除号 -->
        <button class="key key--danger" type="button" data-action="clear">AC</button>
        <button class="key key--soft" type="button" data-action="back" aria-label="退格">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9L3 12l6-7Z" />
            <path d="M13 9.5l5 5M18 9.5l-5 5" />
          </svg>
        </button>
        <!-- 注意：括号字面量在 HTML 里不需要转义，直接写 ( 和 ) 就行 -->
        <button class="key key--soft" type="button" data-value="(">(</button>
        <button class="key key--soft" type="button" data-value=")">)</button>
        <button class="key key--op" type="button" data-value="÷">÷</button>

        <!-- 第三行：7 8 9 % × -->
        <button class="key key--num" type="button" data-value="7">7</button>
        <button class="key key--num" type="button" data-value="8">8</button>
        <button class="key key--num" type="button" data-value="9">9</button>
        <button class="key key--op" type="button" data-value="%">%</button>
        <button class="key key--op" type="button" data-value="×">×</button>

        <!-- 第四行：4 5 6 ± −
             注意这里的减号不是键盘上的 -，而是 &minus; 这个「数学减号」字符（−），
             它更长更好看。JS 里为了区分，用常量 MINUS 记着它 -->
        <button class="key key--num" type="button" data-value="4">4</button>
        <button class="key key--num" type="button" data-value="5">5</button>
        <button class="key key--num" type="button" data-value="6">6</button>
        <button class="key key--soft" type="button" data-action="negate" aria-label="正负号">±</button>
        <button class="key key--op" type="button" data-value="−">−</button>

        <!-- 第五行：1 2 3 √ + -->
        <button class="key key--num" type="button" data-value="1">1</button>
        <button class="key key--num" type="button" data-value="2">2</button>
        <button class="key key--num" type="button" data-value="3">3</button>
        <button class="key key--soft" type="button" data-value="√(" aria-label="开平方根">√</button>
        <button class="key key--op" type="button" data-value="+">+</button>

        <!-- 第六行：0 . π x² =
             x² 按钮上显示的是 x²，实际插入的字符是 "²"（上标 2） -->
        <button class="key key--num" type="button" data-value="0">0</button>
        <button class="key key--num" type="button" data-value=".">.</button>
        <button class="key key--soft" type="button" data-value="π">π</button>
        <button class="key key--soft" type="button" data-value="²" aria-label="平方">x²</button>
        <button class="key key--equals" type="button" data-action="equals">=</button>
      </div>
    </main>

    <!-- ---------------- 右侧：历史记录面板 ----------------
         <aside> 是语义标签，表示「和主内容相关、但属于附属信息」的内容。
         这个面板默认是隐藏的（CSS 里 display:none），
         点击右上角时钟图标后 JS 会给它加上 is-open 类，它才显示出来 -->
    <aside class="history" id="historyPanel">
      <div class="history__head">
        <h2>历史记录</h2>
        <button id="clearHistoryBtn" class="text-btn" type="button">清空</button>
      </div>

      <!-- 这是一个空列表。里面的每一条记录都由 JS 动态创建并塞进来 -->
      <ul class="history__list" id="historyList"></ul>

      <!-- 「还没有记录」的提示文字。JS 会在有记录时给它加上 hidden 属性，
           hidden 是 HTML 内置属性，效果等于 CSS 的 display:none -->
      <p class="history__empty" id="historyEmpty">还没有记录，按 “=” 计算结果后会出现在这里。</p>
    </aside>
  </div>

  <!-- ============================================================
       哈希计算弹层（模态框）
       ============================================================
       它放在 .app 的外面，是因为要「浮在整页之上」，
       而不是挤在计算器和历史记录中间。

       三层结构：
         .modal            铺满屏幕的容器（负责定位和居中）
           .modal__backdrop  半透明黑幕（点一下可以关闭）
           .modal__panel     真正的面板

       hidden 属性：HTML 内置属性，等于 CSS 的 display:none。
       JS 通过 hashModal.hidden = true / false 来控制显示与隐藏。

       【无障碍小知识】
         role="dialog"     告诉读屏软件「这是一块对话面板」
         aria-modal="true" 告诉读屏软件「打开时，焦点应该被限制在面板里」
         aria-labelledby   指定用哪个元素的文字作为这块面板的标题 -->
  <div class="modal" id="hashModal" hidden>
    <!-- 黑幕。它没有 id，JS 是通过点击位置（event.target）来判断要不要关闭的 -->
    <div class="modal__backdrop"></div>

    <section class="modal__panel"
             role="dialog"
             aria-modal="true"
             aria-labelledby="hashTitle">

      <div class="hash__head">
        <h2 id="hashTitle">哈希计算</h2>
        <!-- 关闭按钮。里面直接写一个 ✕ 字符，不用 SVG 更简单 -->
        <button id="hashCloseBtn" class="icon-btn hash__close" type="button" aria-label="关闭">✕</button>
      </div>

      <!-- 输入区域。
           <textarea> 是多行文本框（输入框用 <input>，但那个只能输入一行，不适合长文本）。
           spellcheck="false" 关掉拼写检查，否则输入英文时会满是红色波浪线。
           这里没有 <label> 标签，用 placeholder 和 aria-label 来描述它的用途。 -->
      <textarea id="hashInput"
                class="hash__input"
                rows="3"
                spellcheck="false"
                aria-label="要计算哈希的文本"
                placeholder="在这里输入任意文本（中文、英文、数字都行），下面会实时算出它的哈希值…"></textarea>

      <!-- 算法切换按钮组。
           注意：这 4 个按钮不在 HTML 里写死，而是由 src/app/hashPanel.js
           根据算法列表动态生成的。这样以后要加 SM3，只改那个数组就行。
           role="group" 告诉读屏软件「这几个按钮是一组的」 -->
      <div class="hash__algs" id="hashAlgs" role="group" aria-label="选择哈希算法"></div>

      <!-- 结果显示区 -->
      <div class="hash__out">
        <div class="hash__label">
          <span><span id="hashAlgName">MD5</span> 结果</span>
          <span id="hashBits">128 位</span>
        </div>

        <!-- <output> 是语义标签，专门用来显示「计算产生的结果」。
             JS 会把哈希值写进它的 textContent。
             is-empty 类表示「还没输入内容」的灰色占位状态。 -->
        <output id="hashResult" class="hash__value is-empty">—</output>

        <div class="hash__actions">
          <button id="hashCopyBtn" class="text-btn" type="button">复制</button>
        </div>
      </div>
    </section>
  </div>

  <!-- ============================================================
       口算擂台弹层
       ============================================================
       结构和哈希弹层完全一样（.modal → 黑幕 + 面板）。
       区别在于面板里有「三块互斥的界面」，同一时刻只显示其中一块：

         #gameSetup  选关卡   （对应 state.status === "idle"）
         #gamePlay   答题中   （对应 state.status === "playing"）
         #gameOver   结算     （对应 state.status === "over"）

       JS 靠切换 hidden 属性来决定显示哪一块，
       这就是「一个状态决定一块界面」的写法，逻辑最清楚。
       ============================================================ -->
  <div class="modal" id="gameModal" hidden>
    <div class="modal__backdrop"></div>

    <section class="modal__panel panel--game"
             role="dialog"
             aria-modal="true"
             aria-labelledby="gameTitle">

      <div class="game__head">
        <h2 id="gameTitle">口算擂台</h2>
        <button id="gameCloseBtn" class="icon-btn hash__close" type="button" aria-label="关闭">✕</button>
      </div>

      <!-- ---------- 第一块：选关卡 ---------- -->
      <div id="gameSetup">
        <p class="game__tip">
          规则：答对得分，连击越高单题得分越高（3 秒内答完还有手速奖励）；
          答错扣一条命，跳过扣 5 秒。时间归零或生命用光就结算。
        </p>
        <!-- 关卡卡片由 src/game/panel.js 根据 LEVELS 数组动态生成 -->
        <div class="game__levels" id="gameLevels"></div>
      </div>

      <!-- ---------- 第二块：答题中 ---------- -->
      <div id="gamePlay" hidden>
        <!-- 顶部四项数据。aria-live="polite" 让读屏软件能播报变化 -->
        <div class="game__stats">
          <div class="stat">
            <span class="stat__label">得分</span>
            <strong id="gameScore" aria-live="polite">0</strong>
          </div>
          <div class="stat">
            <span class="stat__label">连击</span>
            <strong id="gameCombo">—</strong>
          </div>
          <div class="stat">
            <span class="stat__label">生命</span>
            <strong id="gameLives">♥♥♥</strong>
          </div>
          <div class="stat">
            <span class="stat__label">剩余</span>
            <strong id="gameTime" aria-live="off">60</strong>
          </div>
        </div>

        <!-- 题目与答题区，做成和计算器显示屏同款的墨绿 LCD 外观 -->
        <div class="game__stage">
          <div class="game__question" id="gameQuestion">—</div>

          <!-- 答案输入框。
               inputmode="numeric" 会让手机弹出「纯数字键盘」，输入更方便；
               autocomplete="off" 关掉浏览器的自动填充（否则会挡住屏幕）；
               spellcheck="false" 关掉拼写检查 -->
          <input id="gameAnswer"
                 class="game__answer"
                 type="text"
                 inputmode="numeric"
                 autocomplete="off"
                 spellcheck="false"
                 placeholder="写下答案"
                 aria-label="答案" />

          <!-- 反馈提示：答对 / 答错 / 跳过 都显示在这里 -->
          <p class="game__feedback" id="gameFeedback" aria-live="polite"></p>
        </div>

        <!-- 虚拟数字键盘，由 JS 按手机计算器的习惯生成 -->
        <div class="game__pad" id="gamePad"></div>

        <div class="game__actions">
          <button id="gameQuitBtn" class="text-btn" type="button">结束本局</button>
          <button id="gameSkipBtn" class="text-btn" type="button">跳过 (−5 秒)</button>
        </div>
      </div>

      <!-- ---------- 第三块：结算 ---------- -->
      <div id="gameOver" hidden>
        <h3 class="game__over-title" id="gameOverTitle">本局结束</h3>
        <!-- 成绩清单由 JS 填充 -->
        <ul class="game__summary" id="gameSummary"></ul>
        <div class="game__actions">
          <button id="gameAgainBtn" class="game__again" type="button">再来一局</button>
        </div>
      </div>
    </section>
  </div>

  <!-- 引入脚本。type="module" 表示这是一个「ES 模块」：
       它可以在文件里用 import 语句引入别的文件，
       而且默认带「延迟执行」的效果 —— 浏览器会等 HTML 全部解析完才跑它，
       所以 main.js 里可以直接 getElementById，不怕找不到元素。 -->
  <script type="module" src="/src/main.js"></script>
</body>

</html>
